<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>梦幻贪吃蛇</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        html,body{
            width:100%;
            min-height:100vh;
            overflow:hidden;
            background:linear-gradient(45deg,#ffb6d2,#ff6b9e,#ff477e,#e82e5c);
            background-size:400% 400%;
            animation:gradientBg 15s ease infinite;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            touch-action:none;
            position:relative;
            padding:10px;
        }
        @keyframes gradientBg{
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
        .particle{
            position:absolute;
            width:10px;
            height:10px;
            background:#ffd0e0;
            border-radius:2px;
            box-shadow:0 0 15px #ff88aa,0 0 30px #ff5588;
            pointer-events:none;
            animation:particleAnim forwards linear;
        }
        @keyframes particleAnim {
            0%{transform:rotate(45deg) translate(0,0) scale(1);opacity:0.9;}
            100%{transform:rotate(45deg) translate(var(--tx),var(--ty)) scale(var(--s));opacity:0;}
        }

        .welcome{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:linear-gradient(135deg,#ff9bbb,#ff8fb1,#ff7aa2,#ff6490);
            background-size:300% 300%;
            animation:welcomeBg 8s ease infinite;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            z-index:99999;
        }
        @keyframes welcomeBg {
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }

        .title-wrapper {
            perspective:1000px;
            cursor:grab;
        }
        .title-wrapper:active {
            cursor:grabbing;
        }

        .welcome-title{
            font-size:clamp(2.5rem,10vw,5rem);
            color:#fff;
            text-shadow:0 0 20px rgba(255,136,170,0.8),
                         0 0 40px rgba(255,136,170,0.6),
                         0 0 60px rgba(255,100,144,0.5);
            animation:rotate3d 8s linear infinite;
            user-select:none;
            margin-bottom:30px;
            letter-spacing:2px;
            transform-style:preserve-3d;
        }

        .start-btn{
            padding:14px 40px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(12px);
            color:#fff;
            border:2px solid rgba(255,255,255,0.6);
            border-radius:50px;
            font-size:clamp(1rem,3.5vw,1.6rem);
            font-weight:bold;
            cursor:pointer;
            transition:all 0.4s cubic-bezier(0.25,1,0.5,1);
            text-shadow:0 0 10px #ff88aa;
            box-shadow:0 0 25px rgba(255,136,170,0.4),
                        0 8px 20px rgba(0,0,0,0.1);
        }
        .start-btn:hover{
            background:#ff88aa;
            color:#fff;
            transform:scale(1.08);
            box-shadow:0 0 40px rgba(255,136,170,0.7);
            border-color:#fff;
        }

        @keyframes rotate3d {
            0%{transform:rotateY(0deg);}
            100%{transform:rotateY(360deg);}
        }

        .game-container {
            display:none;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:8px;
            width:100%;
            max-width:420px;
        }
        .canvas-wrapper {
            position:relative;
            width:100%;
            aspect-ratio:1/1;
        }
        #gameBox {
            border:3px solid #ffffff;
            background:rgba(255,255,255,0.4);
            border-radius:8px;
            width:100%;
            height:100%;
            display:block;
        }
        .record-tip {
            position:absolute;
            top:10%;
            left:50%;
            transform:translate(-50%,-50%);
            font-size:clamp(13px,3vw,16px);
            color:#ffffff;
            font-weight:bold;
            text-shadow:0 0 6px #ff88aa,0 0 12px #ff6b9e,0 0 18px #ff477e;
            background:rgba(255,182,210,0.35);
            padding:4px 10px;
            border-radius:20px;
            border:2px solid rgba(255,255,255,0.5);
            backdrop-filter:blur(4px);
            opacity:0;
            transition:all 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
            pointer-events:none;
            z-index:5;
            white-space:nowrap;
            box-shadow:0 4px 15px rgba(255,107,158,0.4);
        }
        p {
            font-size:clamp(16px,4vw,19px);
            color:#ffffff;
            font-weight:bold;
            text-shadow:0 0 5px #ff88aa;
            text-align:center;
            white-space:nowrap;
        }
        #openSpeedBtn,#changeStyleBtn {
            padding:clamp(8px,2vw,11px) clamp(16px,4vw,22px);
            margin:6px 0 10px;
            background:#ff88aa;
            color:white;
            border:none;
            border-radius:12px;
            font-size:clamp(15px,3.5vw,17px);
            font-weight:bold;
            cursor:pointer;
            transition:0.2s;
            box-shadow:0 0 10px rgba(255,136,170,0.3);
            white-space:nowrap;
        }
        #openSpeedBtn:hover,#changeStyleBtn:hover {
            background:#ff477e;
            transform:scale(1.05);
        }
        .speed-modal, .style-modal {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.3);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
        }
        .speed-card, .style-card {
            background:rgba(255,255,255,0.95);
            padding:clamp(20px,5vw,32px);
            border-radius:16px;
            box-shadow:0 0 20px rgba(255,136,170,0.5);
            text-align:center;
            border:2px solid #ff88aa;
            width:90%;
            max-width:320px;
        }
        .speed-card h2, .style-card h2 {
            color:#ff477e;
            margin-bottom:18px;
            font-size:clamp(20px,5vw,24px);
        }
        .speed-btn, .style-btn {
            padding:clamp(10px,3vw,13px) clamp(18px,5vw,26px);
            margin:6px;
            border:none;
            border-radius:12px;
            font-size:clamp(15px,4vw,17px);
            font-weight:bold;
            cursor:pointer;
            background:#ff88aa;
            color:white;
            transition:0.2s;
            width:80%;
        }
        .speed-btn:hover, .style-btn:hover {
            background:#ff477e;
            transform:scale(1.05);
        }
        .game-over-modal {
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.4);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:9999;
            backdrop-filter:blur(6px);
        }
        .score-card {
            background:rgba(255,255,255,0.95);
            width:90%;
            max-width:320px;
            border-radius:24px;
            padding:clamp(24px,6vw,36px);
            border:3px solid #ff88aa;
            box-shadow:0 8px 30px rgba(255,107,158,0.4);
            text-align:center;
            animation:popup 0.45s ease;
        }
        @keyframes popup {
            0%{transform:scale(0.7);opacity:0;}
            100%{transform:scale(1);opacity:1;}
        }
        .score-title {
            font-size:clamp(20px,5vw,26px);
            color:#ff477e;
            margin-bottom:12px;
            font-weight:bold;
        }
        .score-number {
            font-size:clamp(36,10vw,50px);
            color:#ff6b9e;
            font-weight:bold;
            margin:10px 0;
        }
        .score-info {
            font-size:clamp(14px,3.5vw,16px);
            color:#666;
            margin:6px 0;
        }
        .restart-btn {
            margin-top:20px;
            padding:clamp(10px,3vw,14px) clamp(24px,6vw,36px);
            background:linear-gradient(90deg,#ff88aa,#ff6b9e,#ff477e);
            color:white;
            border:none;
            border-radius:30px;
            font-size:clamp(15px,4vw,18px);
            font-weight:bold;
            cursor:pointer;
            box-shadow:0 4px 12px rgba(255,107,158,0.3);
            transition:0.2s;
            width:100%;
        }
        .restart-btn:hover {
            transform:scale(1.02);
        }
    </style>
</head>
<body>

<div class="welcome" id="welcomePage">
    <div class="title-wrapper">
        <h1 class="welcome-title">梦幻贪吃蛇</h1>
    </div>
    <button class="start-btn" onclick="startGameClick()">开始游戏</button>
</div>

<!-- 速度选择弹窗 -->
<div class="speed-modal" id="speedModal">
    <div class="speed-card">
        <h2>选择游戏速度</h2>
        <button class="speed-btn" data-speed="slow">🐌 慢速</button>
        <button class="speed-btn" data-speed="mid">🌸 中速</button>
        <button class="speed-btn" data-speed="fast">⚡ 快速</button>
    </div>
</div>

<!-- 蛇样式选择弹窗 -->
<div class="style-modal" id="styleModal">
    <div class="style-card">
        <h2>选择蛇样式</h2>
        <button class="style-btn" data-style="default">粉色</button>
        <button class="style-btn" data-style="rainbow">彩虹</button>
        <button class="style-btn" data-style="crystal">水晶</button>
        <button class="style-btn" data-style="neon">暗黑</button>
        <button class="style-btn" data-style="blue">浅蓝</button>
        <button class="style-btn" data-style="classic">复古</button>
    </div>
</div>

<div class="game-over-modal" id="gameOverModal">
    <div class="score-card">
        <div class="score-title">🌸 游戏结束 🌸</div>
        <div class="score-number" id="finalScore">0</div>
        <div class="score-info">本局得分</div>
        <div class="score-info">最高记录：<span id="cardMaxScore">0</span></div>
        <button class="restart-btn" onclick="restartGame()">再来一局</button>
    </div>
</div>

<div class="game-container" id="gameMain">
    <button id="openSpeedBtn">⚙️ 当前速度：未选择</button>
    <button id="changeStyleBtn">🎨 当前样式：默认粉色</button>

    <p>分数：<span id="score">0</span></p>
    <div class="canvas-wrapper">
        <canvas id="gameBox" width="400" height="400"></canvas>
        <div class="record-tip" id="recordTip">🌸 恭喜打破记录！🌸</div>
    </div>
    <p>键盘方向键 / 手机滑动操控</p>
    <p>游玩局数：<span id="gameCount">0</span></p>
    <p>最高分数：<span id="maxScore">0</span></p>
    <p>平均得分：<span id="avgScore">0</span></p>
</div>

<script>
    // ====================== 3D旋转完美控制 ======================
    const wrapper = document.querySelector('.title-wrapper');
    const title = document.querySelector('.welcome-title');
    let isDragging = false;
    let startX = 0;
    currentRotate = 0;

    wrapper.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        title.style.animation = 'none';
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const moveX = e.clientX - startX;
        currentRotate += moveX * 0.5;
        title.style.transform = `rotateY(${currentRotate}deg)`;
        startX = e.clientX;
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
        setTimeout(() => {
            title.style.animation = 'rotate3d 8s linear infinite';
        }, 50);
    });
    wrapper.addEventListener('mouseleave', () => {
        isDragging = false;
        setTimeout(() => {
            title.style.animation = 'rotate3d 8s linear infinite';
        }, 50);
    });

    // ====================== 游戏核心代码 ======================
    const canvas = document.getElementById('gameBox');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score');
    const gameCountDom = document.getElementById('gameCount');
    const maxScoreDom = document.getElementById('maxScore');
    const avgScoreDom = document.getElementById('avgScore');
    const recordTip = document.getElementById('recordTip');
    const speedModal = document.getElementById('speedModal');
    const styleModal = document.getElementById('styleModal');
    const openSpeedBtn = document.getElementById('openSpeedBtn');
    const changeStyleBtn = document.getElementById('changeStyleBtn');
    const gameOverModal = document.getElementById('gameOverModal');
    const finalScore = document.getElementById('finalScore');
    const cardMaxScore = document.getElementById('cardMaxScore');
    const welcomePage = document.getElementById('welcomePage');
    const gameMain = document.getElementById('gameMain');

    const size = 20;
    let snake = [{x:10,y:10}];
    let food = {x:15,y:15};
    let dir = {x:0,y:0};
    let score = 0;
    let startXGame = 0;
    let hasShowInRound = false;
    let isTipShowing = false;
    let gameSpeed = 120;
    let gameInterval = null;
    let currentSpeedText = "未选择";
    let gameCount = 0;
    let maxScore = 0;
    let totalScore = 0;
    let snakeStyle = "default";

    // 彩虹食物渐变控制（变慢核心）
    let rainbowHue = 0;

    function startGameClick(){
        welcomePage.style.display = "none";
        gameMain.style.display = "flex";
        speedModal.style.display = 'flex';
    }

    openSpeedBtn.addEventListener('click', () => {
        speedModal.style.display = 'flex';
    });

    changeStyleBtn.addEventListener('click', () => {
        styleModal.style.display = 'flex';
    });

    function updateSpeedBtnText() {
        openSpeedBtn.innerText = `⚙️ 当前速度：${currentSpeedText}`;
    }

    function updateStyleBtnText(name) {
        changeStyleBtn.innerText = `🎨 当前样式：${name}`;
    }

    document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const speed = btn.dataset.speed;
            if (speed === 'slow') { gameSpeed = 200; currentSpeedText = "🐌 慢速"; }
            if (speed === 'mid') { gameSpeed = 140; currentSpeedText = "🌸 中速"; }
            if (speed === 'fast') { gameSpeed = 80; currentSpeedText = "⚡ 快速"; }
            updateSpeedBtnText();
            speedModal.style.display = 'none';
            startGame();
        });
    });

    document.querySelectorAll('.style-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            snakeStyle = btn.dataset.style;
            let styleName = btn.innerText.replace(/^[^\u4e00-\u9fa5]+/,'');
            updateStyleBtnText(styleName);
            styleModal.style.display = 'none';
        });
    });

    document.addEventListener('keydown', e => {
        if(e.key==='ArrowUp'   && dir.y!==1) dir={x:0,y:-1};
        if(e.key==='ArrowDown' && dir.y!==-1) dir={x:0,y:1};
        if(e.key==='ArrowLeft' && dir.x!==1) dir={x:-1,y:0};
        if(e.key==='ArrowRight'&& dir.x!==-1) dir={x:1,y:0};
    });

    canvas.addEventListener('touchstart', e => {
        startXGame = e.touches[0].clientX;
        e.preventDefault();
    });

    canvas.addEventListener('touchend', e => {
        const endX = e.changedTouches[0].clientX;
        const dx = endX - startXGame;
        if(Math.abs(dx) > 30){
            dx > 0 ? dir = {x:1,y:0} : dir = {x:-1,y:0};
        }else{
            dx > 0 ? dir = {x:0,y:1} : dir = {x:0,y:-1};
        }
        e.preventDefault();
    });

    function createFood(){
        food.x = Math.floor(Math.random()*20);
        food.y = Math.floor(Math.random()*20);
    }

    // 🌈 彩虹食物渐变速度已调慢
    function getFoodColor(){
        switch(snakeStyle){
            case "rainbow":
                rainbowHue += 2; // 数值越小，渐变越慢
                if(rainbowHue > 360) rainbowHue = 0;
                return `hsl(${rainbowHue},80%,60%)`;
            case "crystal": return '#64b5f6';
            case "neon": return '#b066ff';
            case "blue": return '#1976d2';
            case "classic": return '#1b5e20';
            default: return '#ff2e63';
        }
    }

    function drawRect(x,y,index){
        const cellW = size - 1;
        const cellH = size - 1;
        switch(snakeStyle){
            case "rainbow":
                let hue = (index * 20) % 360;
                ctx.fillStyle = `hsl(${hue}, 80%, 60%)`;
                ctx.fillRect(x*size,y*size,cellW,cellH);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(x*size,y*size,cellW,cellH);
                break;
            case "crystal":
                ctx.fillStyle = 'rgba(220, 240, 255, 0.7)';
                ctx.fillRect(x*size,y*size,cellW,cellH);
                ctx.strokeStyle = '#80bfff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x*size,y*size,cellW,cellH);
                break;
            case "neon":
                ctx.fillStyle = '#222';
                ctx.fillRect(x*size,y*size,cellW,cellH);
                ctx.strokeStyle = '#b066ff';
                ctx.lineWidth = 2;
                ctx.strokeRect(x*size,y*size,cellW,cellH);
                break;
            case "blue":
                ctx.fillStyle = '#a0d8ef';
                ctx.fillRect(x*size,y*size,cellW,cellH);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.strokeRect(x*size,y*size,cellW,cellH);
                break;
            case "classic":
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(x*size,y*size,cellW,cellH);
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 1;
                ctx.strokeRect(x*size,y*size,cellW,cellH);
                break;
            default:
                ctx.fillStyle = '#ff6996';
                ctx.fillRect(x*size,y*size,cellW,cellH);
        }
    }

    function updateStat(){
        gameCountDom.innerText = gameCount;
        maxScoreDom.innerText = maxScore;
        avgScoreDom.innerText = gameCount ? (totalScore/gameCount).toFixed(1) : 0;
    }

    function updateTipCollision(){
        if(!isTipShowing) return;
        const head = snake[0];
        if (head.y >= 0 && head.y <= 3) {
            recordTip.style.opacity = 0.2;
        } else {
            recordTip.style.opacity = 1;
        }
    }

    function showRecordHint(){
        if(gameCount < 1 || hasShowInRound) return;
        hasShowInRound = true;
        isTipShowing = true;
        recordTip.style.opacity = 1;
        recordTip.style.transform = "translate(-50%, -50%) scale(1.05)";
        setTimeout(()=>{
            recordTip.style.opacity = 0;
            recordTip.style.transform = "translate(-50%, -50%) scale(1)";
            isTipShowing = false;
        },2500);
    }

    function resetGame(){
        gameCount++;
        totalScore += score;
        hasShowInRound = false;
        isTipShowing = false;
        updateStat();
        score = 0;
        scoreText.innerText = score;
        snake = [{x:10,y:10}];
        dir = {x:0,y:0};
        createFood();
    }

    function gameOver(){
        clearInterval(gameInterval);
        finalScore.innerText = score;
        cardMaxScore.innerText = maxScore;
        gameOverModal.style.display = 'flex';
    }

    function restartGame(){
        gameOverModal.style.display = 'none';
        resetGame();
        startGame();
    }

    function game(){
        if(snake[0].x<0||snake[0].x>=20||snake[0].y<0||snake[0].y>=20){gameOver();return;}
        for(let i=1;i<snake.length;i++){
            if(snake[i].x===snake[0].x&&snake[i].y===snake[0].y){gameOver();return;}
        }

        updateTipCollision();

        if(snake[0].x===food.x&&snake[0].y===food.y){
            score++;
            scoreText.innerText = score;
            snake.push({});
            createFood();
            if(score>maxScore){
                maxScore=score;
                showRecordHint();
                updateStat();
            }
        }
        for(let i=snake.length-1;i>0;i--){snake[i]={...snake[i-1]};}
        snake[0].x += dir.x;
        snake[0].y += dir.y;

        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillRect(0,0,400,400);
        
        ctx.fillStyle = getFoodColor();
        ctx.fillRect(food.x*size,food.y*size,size-1,size-1);
        
        snake.forEach((item, idx)=>drawRect(item.x,item.y, idx));
    }

    function startGame(){
        if(gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(game, gameSpeed);
    }

    function createParticle(){
        const p = document.createElement('div');
        p.classList.add('particle');
        document.body.appendChild(p);
        const x = Math.random() * innerWidth;
        const y = Math.random() * innerHeight;
        const dur = Math.random() * 3 + 2;
        const tx = Math.random() * 100 - 50;
        const ty = Math.random() * -100 - 50;
        const s = Math.random() * 0.6 + 0.4;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.animationDuration = dur + 's';
        p.style.setProperty('--tx', tx + 'px');
        p.style.setProperty('--ty', ty + 'px');
        p.style.setProperty('--s', s);
        setTimeout(() => p.remove(), dur * 1000);
    }
    setInterval(createParticle, 50);
</script>
</body>
</html>
